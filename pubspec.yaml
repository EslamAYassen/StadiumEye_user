name: stadium_eye
description: "Stadium Eye project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_localization: ^0.3.3
  http: ^1.6.0
  iconsax_flutter: ^1.0.1
  intl: ^0.20.2
  persistent_bottom_nav_bar_v2: ^6.2.0
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  bloc: ^9.1.0
  video_player: ^2.10.1
  flutter_secure_storage: ^9.2.4
  lottie: ^3.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/stadium_light.jpeg
    - assets/images/stadium_night.jpeg
    - assets/images/logo_app.jpg
    - assets/videos/
    - assets/lottie/RollingFootbll.json
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  template_arbs: [app_en.arb]
  output_dir: lib/l10n/generated