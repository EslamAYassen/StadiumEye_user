name: stadium_eye
description: "Stadium Eye project."

publish_to: "none"

version: 1.1.2+65

environment:
  sdk: ^3.10.0

dependencies:
  flutter_dotenv: ^5.1.0
  animated_text_kit: ^4.3.0
  awesome_dialog: ^3.3.0
  bloc: ^9.1.0
  cupertino_icons: ^1.0.8
  custom_refresh_indicator: ^4.0.1
  dartz: ^0.10.1
  dio: ^5.9.0
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  # flutter_otp_text_field: ^1.5.1+1
  flutter_secure_storage: ^9.2.4
  get_it: ^9.2.0
  http: ^1.6.0
  iconsax_flutter: ^1.0.1
  image_picker: ^1.2.1
  infinite_scroll_pagination: ^5.1.1
  internet_connection_checker_plus: ^2.9.1
  intl: ^0.20.2
  lottie: ^3.3.2
  path: ^1.9.1
  persistent_bottom_nav_bar_v2: ^6.2.0
  shared_preferences: ^2.2.2
  skeletonizer: ^2.1.1
  syncfusion_flutter_datepicker: ^31.2.18
  video_player: ^2.10.1
  pinput: ^6.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # change_app_package_name: ^1.5.0
  rename_app: ^1.6.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_app.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo_app.jpg"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo_app.jpg"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo_app.jpg"

flutter:
  generate: true
  uses-material-design: true
  assets:
    # - assets/images/stadium_light.jpeg
    # - assets/images/stadium_night.jpeg
    # - assets/images/logo_app.jpg
    - assets/images/
    - assets/fonts/cairo/
    # - assets/images/
    - assets/videos/
    - assets/lottie/RollingFootbll.json
    - .env
  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Black.ttf
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
        - asset: assets/fonts/cairo/Cairo-Light.ttf
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  template_arbs: [ app_en.arb ]
  output_dir: lib/l10n/generated
